stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/iris.csv
    params:
      - prepare.test_size
      - prepare.seed
    outs:
      - data/prepared

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/prepared
    params:
      - train.n_estimators
      - train.max_depth
      - train.learning_rate
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/prepared
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
